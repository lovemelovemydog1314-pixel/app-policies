<!doctype html>
<html lang="zh-Hans" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d14">
  <title>404 · 页面未找到</title>
  <link rel="stylesheet" href="shared/site.css?v=20261029">
  <style>
    .not-found-page {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .not-found-code {
      font-size: clamp(5rem, 14vw, 9rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
      background: linear-gradient(180deg, var(--accent) 0%, var(--muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    .not-found-page h1 {
      font-size: clamp(1.8rem, 3.5vw, 2.4rem);
      margin-bottom: 12px;
    }
    .not-found-page p {
      max-width: 46ch;
      margin-bottom: 32px;
      font-size: 1.05rem;
    }
  </style>
  <script>
    try {
      var savedTheme = localStorage.getItem('app-policies-theme');
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="header wrap">
    <div class="brand-group">
      <a class="brand" href="index.html">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)">
          <rect width="18" height="18" x="3" y="3" rx="4"/>
          <path d="M3 9h18"/>
          <path d="M9 21V9"/>
        </svg>
        <span>Mac 独立精选</span>
      </a>
    </div>
  </header>

  <main class="wrap not-found-page">
    <div class="not-found-code">404</div>
    <h1>页面未找到</h1>
    <p>抱歉，您访问的页面不存在或已被移除。您可以返回聚合主页查看所有 Mac 应用。</p>
    <a class="button" href="index.html">返回全部应用主页 →</a>
  </main>
</body>
</html>
